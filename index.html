<!doctype html>
<html lang="uz" class="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090b" />
    <meta name="supported-color-schemes" content="dark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>CloudBot — Botlar uchun 24/7 Cloud Hosting</title>
    <meta name="description" content="Telegram va Discord botlarini .zip orqali yuklab, 24/7 cloud hostingda ishga tushiruvchi SaaS platforma." />
    <meta property="og:title" content="CloudBot — Botlar uchun 24/7 Cloud Hosting" />
    <meta property="og:description" content="Telegram va Discord botlarini .zip orqali yuklab, 24/7 cloud hostingda ishga tushiruvchi SaaS platforma." />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="/src/index.css" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9609197230968802" crossorigin="anonymous"></script>
    <script>
      // Cleanly handle benign iframe WebSocket notices when HMR is disabled
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && (event.reason ? (event.reason.message || event.reason + '') : '');
        if (typeof reason === 'string' && /websocket|ws:/i.test(reason)) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      }, true);
    </script>
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
        --spacing: 4px;
        --tw-leading: 1.5;
      }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #09090b;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-text-size-adjust: 100%;
        line-height: 1.5;
      }
      /* Prevent unstyled raw browser links and buttons on any browser */
      a {
        color: inherit;
        text-decoration: none;
      }
      a:visited {
        color: inherit;
      }
      button, [role="button"] {
        font-family: inherit;
        border: none;
        outline: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        line-height: 1.25;
      }
      /* Ensure headings have healthy line-height and don't overlap */
      h1, h2, h3, h4, h5, h6 {
        line-height: 1.25 !important;
        margin-top: 0;
      }
      p {
        line-height: 1.5 !important;
      }
      #root {
        min-height: 100vh;
        background-color: #09090b;
      }
    </style>
  </head>
  <body class="bg-[#09090b] text-[#fafafa]">
    <div id="root">
      <div id="app-initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #09090b; color: #e4e4e7; font-family: system-ui, -apple-system, sans-serif; padding: 20px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(34, 197, 94, 0.2); border-top-color: #22c55e; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        <h3 id="loader-title" style="font-size: 18px; font-weight: 600; margin: 0 0 8px 0; color: #ffffff;">CloudBot yuklanmoqda...</h3>
        <p id="loader-desc" style="font-size: 13px; color: #a1a1aa; max-width: 320px; margin: 0 auto 16px auto; line-height: 1.5;">
          Iltimos kuting, xizmatlar ishga tushirilmoqda...
        </p>
        <div id="loader-actions" style="display: none; margin-top: 10px;">
          <button onclick="window.location.reload(true)" style="background: #22c55e; color: #000; font-weight: 600; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px;">Qayta yuklash</button>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function() {
        if (!window.__hasAppLoaded) {
          var desc = document.getElementById('loader-desc');
          var actions = document.getElementById('loader-actions');
          if (desc) desc.textContent = "Yuklanish odatdagidan ko'proq vaqt olyapti. Internet aloqangizni tekshiring yoki sahifani yangilang.";
          if (actions) actions.style.display = 'block';
        }
      }, 7000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
