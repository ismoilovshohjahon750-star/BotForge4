<!doctype html>
<html lang="uz" class="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090b" />
    <meta name="supported-color-schemes" content="dark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>CloudBot — Botlar uchun 24/7 Cloud Hosting</title>
    <meta name="description" content="Telegram va Discord botlarini .zip orqali yuklab, 24/7 cloud hostingda ishga tushiruvchi SaaS platforma." />
    <meta property="og:title" content="CloudBot — Botlar uchun 24/7 Cloud Hosting" />
    <meta property="og:description" content="Telegram va Discord botlarini .zip orqali yuklab, 24/7 cloud hostingda ishga tushiruvchi SaaS platforma." />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:type" content="website" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Cleanly handle benign iframe WebSocket notices and Firestore transient offline/unavailable messages
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && (event.reason ? (event.reason.message || event.reason + '') : '');
        if (typeof reason === 'string' && (/websocket|ws:/i.test(reason) || /Could not reach Cloud Firestore backend|code=unavailable/i.test(reason))) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      }, true);

      // Handle benign console warnings for transient Firestore offline/unavailable state
      (function() {
        var originalWarn = console.warn;
        var originalError = console.error;
        var isBenignFirestoreNotice = function(args) {
          for (var i = 0; i < args.length; i++) {
            var str = typeof args[i] === 'string' ? args[i] : (args[i] && args[i].message ? args[i].message : '');
            if (str && (/Could not reach Cloud Firestore backend/i.test(str) || /operate in offline mode until it is able to successfully connect/i.test(str))) {
              return true;
            }
          }
          return false;
        };

        console.warn = function() {
          if (isBenignFirestoreNotice(arguments)) return;
          return originalWarn.apply(console, arguments);
        };
        console.error = function() {
          if (isBenignFirestoreNotice(arguments)) {
            // Downgrade to subtle notice without triggering error trackers
            return;
          }
          return originalError.apply(console, arguments);
        };
      })();

      // Safe memory fallback for localStorage/sessionStorage when disabled or restricted in older browsers/private mode
      (function() {
        try {
          var testKey = '__test_storage__';
          window.localStorage.setItem(testKey, '1');
          window.localStorage.removeItem(testKey);
        } catch (e) {
          console.warn('localStorage is restricted or unavailable, installing memory fallback');
          var memStore = {};
          var dummyStorage = {
            getItem: function(k) { return memStore.hasOwnProperty(k) ? memStore[k] : null; },
            setItem: function(k, v) { memStore[k] = String(v); },
            removeItem: function(k) { delete memStore[k]; },
            clear: function() { memStore = {}; },
            get length() { return Object.keys(memStore).length; },
            key: function(i) { return Object.keys(memStore)[i] || null; }
          };
          try {
            Object.defineProperty(window, 'localStorage', { value: dummyStorage, configurable: true, writable: true });
          } catch (_) {}
        }
        // Global object safety for older engines
        if (typeof globalThis === 'undefined') {
          window.globalThis = window;
        }
      })();
    </script>
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
        --spacing: 4px;
        --tw-leading: 1.5;
      }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #09090b;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-text-size-adjust: 100%;
        line-height: 1.5;
      }
      /* Prevent unstyled raw browser links and buttons on any browser */
      a {
        color: inherit;
        text-decoration: none;
      }
      a:visited {
        color: inherit;
      }
      button, [role="button"] {
        font-family: inherit;
        border: none;
        outline: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        line-height: 1.25;
      }
      /* Ensure headings have healthy line-height and don't overlap */
      h1, h2, h3, h4, h5, h6 {
        line-height: 1.25 !important;
        margin-top: 0;
      }
      p {
        line-height: 1.5 !important;
      }
      #root {
        min-height: 100vh;
        background-color: #09090b;
      }
    </style>
  </head>
  <body class="bg-[#09090b] text-[#fafafa]">
    <!-- App Initial Loader (Overlay that automatically fades out and removes itself immediately) -->
    <div id="app-initial-loader" style="position: fixed; inset: 0; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #09090b; color: #e4e4e7; font-family: system-ui, -apple-system, sans-serif; padding: 20px; text-align: center; transition: opacity 0.25s ease-out;">
      <div style="width: 44px; height: 44px; border: 3px solid rgba(34, 197, 94, 0.2); border-top-color: #22c55e; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;"></div>
      <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      <h3 id="loader-title" style="font-size: 18px; font-weight: 600; margin: 0 0 8px 0; color: #ffffff;">CloudBot yuklanmoqda...</h3>
      <p id="loader-desc" style="font-size: 13px; color: #a1a1aa; max-width: 320px; margin: 0 auto 16px auto; line-height: 1.5;">
        Iltimos kuting, xizmatlar ishga tushirilmoqda...
      </p>
      <div id="loader-actions" style="display: none; margin-top: 14px; gap: 8px;">
        <button onclick="refreshApp()" style="background: #22c55e; color: #000; font-weight: 600; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; margin: 0 4px;">Qayta yuklash</button>
        <button onclick="clearAndReload()" style="background: #27272a; color: #fafafa; font-weight: 500; padding: 10px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); cursor: pointer; font-size: 13px; margin: 0 4px;">Keshni tozalash</button>
      </div>
    </div>

    <!-- Main React Mount Container -->
    <div id="root"></div>

    <script>
      function dismissLoader() {
        var loader = document.getElementById('app-initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(function() {
            try { loader.remove(); } catch (_) {}
          }, 300);
        }
      }

      // Automatically dismiss the splash screen after 1.8 seconds max under any circumstance
      setTimeout(function() {
        dismissLoader();
      }, 1800);
    </script>
    <script>
      function refreshApp() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
            });
          }
        } catch (_) {}
        var cleanUrl = window.location.origin + window.location.pathname;
        window.location.replace(cleanUrl);
      }

      function clearAndReload() {
        try {
          localStorage.clear();
          sessionStorage.clear();
        } catch (_) {}
        refreshApp();
      }

      window.addEventListener('error', function(e) {
        if (!window.__hasAppLoaded) {
          var desc = document.getElementById('loader-desc');
          var actions = document.getElementById('loader-actions');
          var msg = e && (e.message || (e.error && e.error.message) || '');
          if (msg && !/ResizeObserver|Script error/i.test(msg)) {
            if (desc) desc.textContent = "Yuklashda uzilish yuz berdi. Iltimos, sahifani qayta yuklang.";
            if (actions) {
              actions.style.display = 'flex';
              actions.style.justifyContent = 'center';
            }
          }
        }
      });

      // Quick fallback if module loading takes more than 4.5 seconds
      setTimeout(function() {
        if (!window.__hasAppLoaded) {
          var desc = document.getElementById('loader-desc');
          var actions = document.getElementById('loader-actions');
          if (desc) desc.textContent = "Xizmatlar ulanishi kutilmoqda. Qayta yuklash tugmasini bosishingiz mumkin.";
          if (actions) {
            actions.style.display = 'flex';
            actions.style.justifyContent = 'center';
          }
        }
      }, 4500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
