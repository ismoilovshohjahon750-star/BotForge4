    <script>
      // Legacy Browser & WebView Polyfills (Pure ES5 for Android 6 / Chrome 44-49)
      (function() {
        if (typeof window.globalThis === 'undefined') {
          window.globalThis = window;
        }
        if (typeof Object.assign !== 'function') {
          Object.assign = function(target) {
            if (target === undefined || target === null) {
              throw new TypeError('Cannot convert undefined or null to object');
            }
            var output = Object(target);
            for (var index = 1; index < arguments.length; index++) {
              var source = arguments[index];
              if (source !== undefined && source !== null) {
                for (var nextKey in source) {
                  if (Object.prototype.hasOwnProperty.call(source, nextKey)) {
                    output[nextKey] = source[nextKey];
                  }
                }
              }
            }
            return output;
          };
        }
        if (!Array.prototype.includes) {
          Array.prototype.includes = function(searchElement, fromIndex) {
            var O = Object(this);
            var len = parseInt(O.length, 10) || 0;
            if (len === 0) return false;
            var n = parseInt(fromIndex, 10) || 0;
            var k;
            if (n >= 0) { k = n; } else { k = len + n; if (k < 0) k = 0; }
            while (k < len) {
              var currentElement = O[k];
              if (searchElement === currentElement || (searchElement !== searchElement && currentElement !== currentElement)) {
                return true;
              }
              k++;
            }
            return false;
          };
        }

        // Global uncaught error listener for legacy and webview environments
        window.__hasAppLoaded = false;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          console.warn('[Global Early Error]:', msg, 'at', url, lineNo);
          if (!window.__hasAppLoaded) {
            var root = document.getElementById('root');
            var errorDetails = document.getElementById('legacy-error-details');
            if (errorDetails) {
              errorDetails.style.display = 'block';
              errorDetails.innerText = 'Xatolik: ' + (msg || 'Noma\'lum xatolik yuz berdi');
            }
          }
          return false;
        };
      })();
    </script>

  <body class="bg-[#0b0f17] text-slate-100">
    <div id="root">
      <!-- Fallback UI displayed until React mounts to prevent white screen -->
      <div id="app-initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0f17; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; padding: 20px; text-align: center;">

          Iltimos, kuting. Tizim komponentlari sozlanmoqda...
        </p>
        <div id="legacy-error-details" style="display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; font-size: 12px; padding: 8px 12px; border-radius: 8px; margin-bottom: 14px; max-width: 90%; word-break: break-all;"></div>
        <button onclick="window.location.reload()" style="background: #2563eb; color: #ffffff; border: none; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;">
          Qayta yuklash 🔄
        </button>
      </div>
    </div>
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        window.__hasAppLoaded = true;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
