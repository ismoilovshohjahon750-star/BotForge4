<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <defs>
    <linearGradient id="cbot-mark-teal" x1="20" y1="10" x2="200" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2dd4bf" />
      <stop offset="50%" stopColor="#14b8a6" />
      <stop offset="100%" stopColor="#0891b2" />
    </linearGradient>
  </defs>

  <!-- Logo Mark (Enlarged Cloud Robot Icon) -->
  <g transform="translate(73, 20) scale(1.15)">
    <!-- Antennas -->
    <line x1="61" y1="29" x2="63.5" y2="13" stroke="url(#cbot-mark-teal)" stroke-width="5" stroke-linecap="round" />
    <circle cx="64" cy="9.5" r="4.3" fill="url(#cbot-mark-teal)" />

    <line x1="67" y1="33" x2="79" y2="19" stroke="url(#cbot-mark-teal)" stroke-width="5" stroke-linecap="round" />
    <circle cx="82" cy="16" r="4.3" fill="url(#cbot-mark-teal)" />

    <!-- Main Cloud Head Contour -->
    <path
      d="M 24 64 
         C 12 64, 8 51, 13 41 
         C 16 33, 25 31, 32 32 
         C 36 20, 52 18, 64 26 
         C 70 30, 75 37, 74 45 
         C 73 54, 71 64, 66 64 
         Z"
      stroke="url(#cbot-mark-teal)"
      stroke-width="5.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Bottom Line of Face Contour -->
    <path
      d="M 24 64 L 66 64"
      stroke="url(#cbot-mark-teal)"
      stroke-width="5.5"
      stroke-linecap="round"
    />

    <!-- Expressive Circular Eyes -->
    <circle cx="37" cy="48" r="4.6" fill="url(#cbot-mark-teal)" />
    <circle cx="53" cy="48" r="4.6" fill="url(#cbot-mark-teal)" />
  </g>

  <!-- Wordmark "CloudBot" -->
  <text 
    x="120" 
    y="150" 
    text-anchor="middle" 
    fill="#14b8a6" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="34" 
    font-weight="800" 
    letter-spacing="-0.02em"
  >
    CloudBot
  </text>
</svg>
