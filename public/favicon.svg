<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fav-bg" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0b172a" />
      <stop offset="50%" stopColor="#060c18" />
      <stop offset="100%" stopColor="#02050c" />
    </linearGradient>

    <!-- Vibrant Neon Cloud/Bot Gradient -->
    <linearGradient id="fav-primary" x1="8" y1="12" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="35%" stopColor="#00f2fe" />
      <stop offset="70%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#4f46e5" />
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="fav-rim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="40%" stopColor="#06b6d4" />
      <stop offset="75%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fav-visor-glow" x1="32" y1="26" x2="32" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#030712" />
      <stop offset="100%" stopColor="#091427" />
    </linearGradient>

    <!-- Filter Glow for Favicon -->
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#fav-bg)" stroke="url(#fav-rim)" stroke-width="1.8"/>

  <!-- Subtle Inner Ambient Mesh Glow -->
  <circle cx="32" cy="34" r="20" fill="#00f2fe" opacity="0.2" filter="url(#fav-glow)" />

  <!-- Signal Antenna -->
  <path d="M32 16 L32 9" stroke="url(#fav-primary)" stroke-width="2.6" stroke-linecap="round" />
  <circle cx="32" cy="8" r="3.2" fill="#00f2fe" filter="url(#fav-glow)" />
  <circle cx="32" cy="8" r="1.4" fill="#ffffff" />
  <path d="M26 5.5 A 9 9 0 0 1 38 5.5" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />

  <!-- Cloud Robot Main Shell -->
  <path
    d="M17 43 C10.5 43 7.5 36.5 10 30.5 C12 25 17 23 21.5 22.5 C24 15 32 12 40 14.5 C46 16.5 49.5 21.5 51 26.5 C56.5 27 60 32.5 58 38 C56.8 42 52 43 47.5 43 Z"
    fill="url(#fav-primary)"
    filter="url(#fav-glow)"
  />

  <!-- Bot Screen Visor -->
  <rect x="17" y="27" width="30" height="14" rx="5" fill="url(#fav-visor-glow)" stroke="#00f2fe" stroke-width="1.2"/>

  <!-- High-Luminance Cyber Eyes -->
  <rect x="21.5" y="30.5" width="6.5" height="7" rx="2.2" fill="#00f2fe" filter="url(#fav-glow)"/>
  <rect x="23" y="31.5" width="3.2" height="3" rx="1" fill="#ffffff"/>

  <rect x="36" y="30.5" width="6.5" height="7" rx="2.2" fill="#00f2fe" filter="url(#fav-glow)"/>
  <rect x="37.5" y="31.5" width="3.2" height="3" rx="1" fill="#ffffff"/>

  <!-- Smile Wave -->
  <path d="M29.5 38 Q32 40 34.5 38" stroke="#34d399" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Cloud Server Connection Pulse Dots -->
  <path d="M22 50 Q32 54 42 50" stroke="url(#fav-primary)" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85"/>
  <circle cx="21" cy="54" r="1.8" fill="#10b981" />
  <circle cx="32" cy="56" r="2.4" fill="#00f2fe" filter="url(#fav-glow)" />
  <circle cx="43" cy="54" r="1.8" fill="#6366f1" />
</svg>

