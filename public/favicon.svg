<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Rich Deep Teal Background -->
    <linearGradient id="fav-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#042f2e" />
      <stop offset="60%" stopColor="#08202c" />
      <stop offset="100%" stopColor="#020d14" />
    </linearGradient>

    <!-- Vibrant Brand Neon Cyan-Emerald Gradient -->
    <linearGradient id="fav-neon" x1="15" y1="10" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="45%" stopColor="#2dd4bf" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="fav-border" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2dd4bf" />
      <stop offset="100%" stopColor="#0891b2" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- High-contrast Badge Container -->
  <rect x="3" y="3" width="94" height="94" rx="26" fill="url(#fav-bg)" stroke="url(#fav-border)" stroke-width="4" />

  <!-- CloudBot Face Centered & Scaled to Fill Container -->
  <g transform="translate(2, 12)" filter="url(#fav-glow)">
    <!-- 1. Left Antenna with Bobble Tip -->
    <line x1="61" y1="29" x2="63.5" y2="13" stroke="url(#fav-neon)" stroke-width="5.5" stroke-linecap="round" />
    <circle cx="64" cy="9.5" r="5" fill="url(#fav-neon)" />

    <!-- 2. Right Antenna with Bobble Tip -->
    <line x1="67" y1="33" x2="79" y2="19" stroke="url(#fav-neon)" stroke-width="5.5" stroke-linecap="round" />
    <circle cx="82" cy="16" r="5" fill="url(#fav-neon)" />

    <!-- 3. Cloud Head Contour with Gentle Translucent Cyan Fill -->
    <path
      d="M 24 64 
         C 12 64, 8 51, 13 41 
         C 16 33, 25 31, 32 32 
         C 36 20, 52 18, 64 26 
         C 70 30, 75 37, 74 45 
         C 73 54, 71 64, 66 64 
         Z"
      fill="#14b8a6"
      fill-opacity="0.18"
      stroke="url(#fav-neon)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 4. Bottom Line of Face Contour -->
    <path
      d="M 24 64 L 66 64"
      stroke="url(#fav-neon)"
      stroke-width="6"
      stroke-linecap="round"
    />

    <!-- 5. High-Contrast Round Optic Eyes -->
    <circle cx="37" cy="48" r="5.2" fill="#ffffff" />
    <circle cx="53" cy="48" r="5.2" fill="#ffffff" />
    <circle cx="37" cy="48" r="2.8" fill="#0d9488" />
    <circle cx="53" cy="48" r="2.8" fill="#0d9488" />
  </g>
</svg>
